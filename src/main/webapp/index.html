<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fit - Acceso al Sistema de Membresías</title>
    <style>
        /* Estilos alineados a la identidad de Smart Fit (Negro y Amarillo) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background-color: #1a1a1a;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(255, 204, 0, 0.15);
            text-align: center;
        }
        .brand-title {
            color: #ffcc00;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .sub-title {
            color: #cccccc;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: #ffcc00;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #262626;
            border: 1px solid #444444;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #ffcc00;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #ffcc00;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s, transform 0.1s;
        }
        .btn-submit:hover {
            background-color: #e6b800;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        .footer-text {
            color: #666666;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-title">SMART FIT</div>
        <div class="sub-title">Gestión de Registro de Membresías</div>

        <!-- Formulario que redirige al controlador de recepción -->
        <form action="LoginServlet" method="POST">
            <div class="input-group">
                <label for="usuario">Usuario / Recepción</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Sistema</button>
        </form>

        <div class="footer-text">
            Sede San Borja &copy; 2026 - Sistema MVC
        </div>
    </div>

</body>
</html>
