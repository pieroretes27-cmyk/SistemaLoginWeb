<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fit - Dashboard CRUD</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #ffc107;
        }
        .card-custom {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 10px;
        }
        .table-dark-custom {
            background-color: #1a1a1a;
            color: #fff;
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            font-weight: bold;
            color: #000;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark px-4">
        <a class="navbar-brand text-warning fw-bold" href="#">SMART FIT <span class="text-white fs-6">| Dashboard</span></a>
        <div class="ms-auto">
            <span class="text-muted me-3">Usuario: <strong>Recepcion</strong></span>
            <a href="index.html" class="btn btn-outline-warning btn-sm">Cerrar Sesión</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col-md-8">
                <h2>Gestión de Membresías y Usuarios</h2>
                <p class="text-muted">Control y administración de accesos - Sede San Borja</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-warning"><i class="bi bi-person-plus-fill"></i> Nuevo Usuario</button>
            </div>
        </div>

        <!-- Tabla CRUD -->
        <div class="card card-custom p-4 shadow">
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr class="text-warning">
                            <th>ID</th>
                            <th>Nombres</th>
                            <th>Correo</th>
                            <th>Membresía</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Piero Retes</td>
                            <td>piero@smartfit.com</td>
                            <td>Black Plan</td>
                            <td><span class="badge bg-success">Activo</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary me-1"><i class="bi bi-pencil-square"></i></button>
                                <button class="btn btn-sm btn-danger me-1"><i class="bi bi-trash-fill"></i></button>
                                <button class="btn btn-sm btn-secondary" title="Desbloquear"><i class="bi bi-unlock-fill"></i></button>
                            </td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Maria Gomez</td>
                            <td>maria@smartfit.com</td>
                            <td>Plan Smart</td>
                            <td><span class="badge bg-danger">Bloqueado</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary me-1"><i class="bi bi-pencil-square"></i></button>
                                <button class="btn btn-sm btn-danger me-1"><i class="bi bi-trash-fill"></i></button>
                                <button class="btn btn-sm btn-warning" title="Desbloquear"><i class="bi bi-unlock-fill"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
