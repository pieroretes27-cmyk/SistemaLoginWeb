<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Fit - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #1a1a1a;
            border: 2px solid #ffc107;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 193, 7, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
        .form-control {
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
        }
        .form-control:focus {
            background-color: #2b2b2b;
            border-color: #ffc107;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
        }
        .form-label {
            color: #ffc107;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            font-weight: bold;
            color: #000;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <h2 class="text-warning fw-bold mb-1">SMART FIT</h2>
        <p class="text-muted small mb-4">Gestión de Registro de Membresías</p>

        <!-- Formulario visual para la web estática -->
        <form onsubmit="event.preventDefault(); alert('Vista de presentación en línea. La conexión con Base de Datos MySQL y Servlets opera de forma local.');">
            <div class="mb-3 text-start">
                <label class="form-label">USUARIO / RECEPCIÓN</label>
                <input type="text" class="form-control" required placeholder="Ingrese su usuario">
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label">CONTRASEÑA</label>
                <input type="password" class="form-control" required placeholder="********">
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 mb-3">INGRESAR AL SISTEMA</button>
        </form>

        <div class="text-muted small mt-3">
            Sede San Borja &copy; 2026 - Sistema MVC
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
